# -------------------------------------------------
# .gitlab-ci.yml – VBT‑converter CI pipeline
# -------------------------------------------------
# Stages
stages:
  - setup_environment
  - test
  - publish_report
  - cleanup

# -----------------------------------------------------------------
# Global variables – keep the same behavior as the original template
# -----------------------------------------------------------------
variables:
  # Force the runner to check out sub‑modules (normal)
  GIT_SUBMODULE_STRATEGY: "normal"

# -----------------------------------------------------------------
# Pull the generic VBT CI definition from the central template repo
# -----------------------------------------------------------------
include:
  - project: 'virtualbraintwin/VBT_protocol_template'   # full path of the source project
    ref:    main                                         # branch / tag you want to use
    file:   '/ci/template.yml'                          # path inside the source repo

# -----------------------------------------------------------------
# SET‑UP – create a clean virtual environment and install deps
# -----------------------------------------------------------------
vbt_setup_job:
  extends: .VBT_SETUP                     # provided by the template
  stage: setup_environment
  image: docker:cli
  tags:
    - docker
    - jsc-cloud
    - fenix
  before_script:
    - echo "Installing jq and Python in the Alpine runner …"
    - apk add --no-cache jq python3 bash curl
    - !reference [ .VBT_SETUP, before_script ]  # Calls the base "method"
  variables:
    VBT_SETUP_SCRIPT: "${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/setup_environment.sh"
    # Use the project's own requirements (which must contain pytest, h5py, pandas, pyyaml, tqdm, numpy, allure‑pytest‑plugin)
    VBT_REQUIREMENTS: "${CI_PROJECT_DIR}/requirements.txt"

unit_tests:
  extends: .VBT_RUN
  stage: test
  tags:
    - docker
    - jsc-cloud
    - fenix
  image: docker:cli
  needs:
    - job: vbt_setup_job
      artifacts: true
  before_script:
    - echo "Installing dependencies in the docker runner …"
    - apk add --no-cache jq python3 bash perl gettext curl
    - !reference [ .VBT_RUN, before_script ]  # Calls the base "method"
  variables:
    VBT_TEST_PATHS: "tests/unit"  # Override the default test suite path to point to the unit tests
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 1 week

test_vbt_convert_parameter_sweep_dir_to_hdf5:
  extends: .VBT_RUN                       # provided by the template
  stage: test
  tags:
    - docker
    - jsc-cloud
    - fenix
  image: docker:cli
  needs:
    - job: vbt_setup_job
      artifacts: true
    - job: unit_tests
      artifacts: true
  variables:
    # The entry‑script for the tests stage is simply “pytest”
    HDF5_DISABLE_VERSION_CHECK: "1"  # Avoid HDF5 version check warnings in the logs
    VBT_ENTRY_SCRIPT: "${CI_PROJECT_DIR}/ci/vbt_converter_ps_to_hdf5_wrapper.py"
    VBT_INPUT_PATH: "${CI_PROJECT_DIR}/tests/test_data/parametersweep_8s_3d_orientation_selective_12012026"
    VBT_OUTPUT_PATH: "${CI_PROJECT_DIR}/data/"
    VBT_ENABLE_OUTPUT_DIR_RECURSIVE_ATTACH: "false" # Do not attach the whole output dir as artifact
    OUTPUT_HDF5_PATH: "${CI_PROJECT_DIR}/converted/converted.hdf5" # Path to the converted HDF5 file (which is the only output artifact we want to attach to CI Job)
    # Allure results are written to `allure-results/`
    # -----------------------------------------------------------------
    # Allure / tests‑metadata – feel free to adapt the wording
    # -----------------------------------------------------------------
    VBT_ALLURE_PARENT_SUITE: "VBT‑converter CI/CD"
    VBT_ALLURE_SUITE: "Integration Tests"
    VBT_ALLURE_SUB_SUITE: "Conversion of parameter‑sweep‑style directories to HDF5 file and validation of the converted file against the ground‑truth HDF5 file"
    VBT_ALLURE_EPIC: "Guarantee that the converter works for every possible input layout"
    VBT_ALLURE_FEATURE: "Use of cached test data to validate the converter’s functionality for a directory layout that is representative of real‑world use cases"
    VBT_ALLURE_STORY: "Integration test for the conversion of parameter‑sweep‑style directories to HDF5 file and validation of the converted file against the ground‑truth HDF5 file (https://tvb-projects.atlassian.net/browse/VT-233)"
    VBT_ALLURE_LINK_JIRA: "https://tvb-projects.atlassian.net/browse/VT-233"
    VBT_ALLURE_DESCRIPTION_HTML: "${CI_PROJECT_DIR}/tests/docs/convert_direc_to_hdf_description.html"
    VBT_DYNAMIC_TEST_NAME_SUFFIX: "test_vbt_convert_parameter_sweep_dir_to_hdf5"
    VBT_ALLURE_TEST_TITLE: "test_vbt_convert_parameter_sweep_dir_to_hdf5"
  before_script:
    - echo "Installing dependencies in the docker runner …"
    - apk add --no-cache jq python3 bash perl gettext curl hdf5-tools
    - !reference [ .VBT_RUN, before_script ]  # Calls the base "method"
  # The artifacts are needed by the publishing stage (Allure results)
  cache:
    - key: vbt-converter-test-cache
      paths:
        - tests/test_data/
      policy: pull
  artifacts:
    when: always
    paths:
      - allure-results/
      - "${CI_PROJECT_DIR}/converted"
    expire_in: 1 week

