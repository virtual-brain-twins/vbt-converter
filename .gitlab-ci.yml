stages:
  - lint
  - setup_environment
  - test
  - integration-pipelines
  - conversion
  - publish_report
  - cleanup

# Global variables – keep the same behavior as the original template
variables:
  # Force the runner to check out sub‑modules (normal)
  GIT_SUBMODULE_STRATEGY: "normal"

  # ---- Default source / destination (can be overridden per‑job) ----
  MINIO_SOURCE_PATH: "ground_truth/"               # folder OR file inside the bucket
  LOCAL_DEST_PATH: "tests/test_data/ground_truth/"

  # ---- Cache configuration (the part you asked for) -----------------
  CACHE_KEY: "vbt-converter-test-cache"
  CACHE_PATH: "tests/test_data/"

# Pull the generic VBT CI definition from the central template repo
include:
  - project: 'virtualbraintwin/VBT_protocol_template'   # full path of the source project
    ref: main                                         # branch / tag you want to use
    file: '/ci/template.yml'                          # path inside the source repo

pre_commit:
  stage: lint
  image: python:3.12-slim
  variables:
    # Always fetch the whole history – required for pre‑commit to see tags/heads.
    GIT_STRATEGY: clone
    GIT_DEPTH: 0          # 0 = no depth limit (full clone)
  tags:
    - docker
    - jsc-cloud
    - fenix
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --upgrade pip setuptools wheel
    - pip install --no-cache-dir pre-commit==4.3.0
  script:
    - pre-commit run --all-files
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# SET‑UP – create a clean virtual environment and install deps
vbt_setup_job:
  extends: .VBT_SETUP                     # provided by the template
  stage: setup_environment
  image: docker:cli
  tags:
    - docker
    - jsc-cloud
    - fenix
  before_script:
    - echo "Installing jq and Python in the Alpine runner …"
    - apk add --no-cache jq python3 bash curl
    - !reference [ .VBT_SETUP, before_script ]  # Calls the base "method"
  variables:
    VBT_SETUP_SCRIPT: "${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/setup_environment.sh"
    # Use the project's own requirements (which must contain pytest, h5py, pandas, pyyaml, tqdm, numpy, allure‑pytest‑plugin)
    VBT_REQUIREMENTS: "${CI_PROJECT_DIR}/requirements.txt"

# 1. Unit Tests: Runs automatically on every commit
unit_tests:
  extends: .VBT_RUN
  stage: test
  tags:
    - docker
    - jsc-cloud
    - fenix
  image: docker:cli
  needs:
    - job: vbt_setup_job
      artifacts: true
  before_script:
    - echo "Installing dependencies in the docker runner …"
    - apk add --no-cache jq python3 bash perl gettext curl
    - !reference [ .VBT_RUN, before_script ]  # Calls the base "method"
  variables:
    VBT_ALLURE_PARENT_SUITE: "VBT‑converter CI/CD"
    VBT_ALLURE_SUITE: "Unit Tests"
    VBT_ALLURE_EPIC: "Guarantee that the converter works for every possible input layout"
    VBT_ALLURE_FEATURE: "Use of cached test data to validate the converter’s functionality for a directory layout that is representative of real‑world use cases"
    VBT_ALLURE_STORY: "Unit test suite for the conversion of parameter‑sweep‑style directories to HDF5 file and validation of the converted file against the ground‑truth HDF5 file (https://tvb-projects.atlassian.net/browse/VT-233). Also conversion of the HDf5 file to NPZ format and their tests."
    VBT_ALLURE_LINK_JIRA: "https://tvb-projects.atlassian.net/browse/VT-233"
    VBT_DYNAMIC_TEST_NAME_SUFFIX: "unit_tests_parameter_sweep_dir_to_hdf5_to_upstream_formats"
    VBT_TEST_PATHS: "tests/unit"  # Override the default test suite path to point to the unit tests
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 1 week

# 2. Integration Pipeline UVA data conversion: Triggered manually via UI or automatically if Pipeline files change
trigger-integration-uva:
  stage: integration-pipelines
  trigger:
    include: tests/integration/vbt_uva_protocol_pipeline/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: "$CI_PIPELINE_ID"
  rules:
    # Run automatically only if files inside pipeline_a folder change
    - changes:
        - tests/integration/vbt_uva_protocol_pipeline/**/*
      when: on_success
    # Allow manual execution from the GitLab UI at any time
    - when: manual
      allow_failure: true

# 3. Integration Pipeline for BG protocol: Triggered manually via UI or automatically if Pipeline files change
trigger-integration-kth:
  stage: integration-pipelines
  trigger:
    include: tests/integration/vbt_kth_protocol_pipeline/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: "$CI_PIPELINE_ID"
  rules:
    - changes:
        - tests/integration/vbt_kth_protocol_pipeline/**/*
      when: on_success
    - when: manual
      allow_failure: true

# PUBLISH – push the Allure report to the VBT‑template publish job
vbt_publish_job:
  extends: .VBT_PUBLISH
  stage: publish_report
  needs:
    - job: unit_tests
      artifacts: true
  variables:
    VBT_PUBLISH_SCRIPT: "${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/publish_report.sh"
  before_script:
    - echo "Installing dependencies in the Alpine runner …"
    - apk add --no-cache jq unzip
    - !reference [ .VBT_PUBLISH, before_script ]  # Calls the base "method"

# CLEAN‑UP – tear‑down the temporary virtual environment
vbt_cleanup_job:
  extends: .VBT_CLEANUP
  tags:
    - docker
    - jsc-cloud
    - fenix
  stage: cleanup
  needs:
    - job: vbt_publish_job
      artifacts: false
  before_script:
    - apk add --no-cache jq bash
    - !reference [ .VBT_RUN, before_script ]  # Calls the base "method"
  variables:
    VBT_CLEANUP_SCRIPT: "${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/cleanup_environment.sh"

# Manual job to update the cache in MinIO with a new version of the ground‑truth file or folder (e.g. after fixing a bug in the converter that caused the old ground‑truth file to be incorrect).
# This job is not part of the regular pipeline run, but can be triggered manually when needed.
# Re‑usable job definition (template)
.fetch_minio_cache_template:                # <-- “anchor” (not a real job)
  stage: setup_environment
  tags:
    - docker
    - jsc-cloud
    - fenix
  image: docker:cli
  when: manual                               # keep it manual, you can change to `on_success`
  variables:
    # The template itself does **not** set CACHE_KEY / CACHE_PATH;
    # they are expected to be injected by the concrete job (or fall back to the globals above).
    # Likewise MINIO_* can be overridden per‑job if needed.
    # (You can add more optional defaults here.)
  before_script:
    # Install runtime deps (bash, curl, mc)
    - echo "▶ Installing runtime dependencies …"
    - apk add --no-cache curl
    - |
      MC_URL="${CI_MC_URL}"
      curl -L "${MC_URL}" -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc

    # Validate **all** required variables (fail fast)
    - |
      missing=""

      for var_name in \
        MINIO_ENDPOINT \
        MINIO_ACCESS_KEY \
        MINIO_SECRET_KEY \
        MINIO_BUCKET \
        MINIO_SOURCE_PATH \
        LOCAL_DEST_PATH
      do
        eval "var_value=\${$var_name}"

        if [ -z "$var_value" ]; then
          missing="$missing\n  - $var_name"
        fi
      done

      if [ -n "$missing" ]; then
        printf "Error: the following CI variable(s) are not defined or are empty:\n"
        printf "%b\n" "$missing"
        printf "Aborting.\n" >&2
        exit 1
      fi

    # Configure MinIO client alias
    - |
      echo "▶ Configuring MinIO alias ‘minio’ …"
      mc alias set minio "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

    # Print the resolved variables (for debugging)
    - |
      echo "▶ Resolved variables:"
      # List the variable *names* you want to dump
      vars="LOCAL_DEST_DIR LOCAL_DEST_PATH MINIO_SRC_PATH CI_CACHE_DIR CI_CACHE_KEY"
      # Loop over each name, use indirect expansion to fetch its value
      for v in $vars; do
        eval "value=\${$v-}"
        printf '%s=%s\n' "$v" "$value"
      done

    # Verify the source path exists on MinIO
    - |
      echo "▶ Checking existence of minio/${MINIO_BUCKET}/${MINIO_SOURCE_PATH} …"
      if ! mc ls "minio/${MINIO_BUCKET}/${MINIO_SOURCE_PATH}" >/dev/null 2>&1; then
        echo "Source path 'minio/${MINIO_BUCKET}/${MINIO_SOURCE_PATH}' does NOT exist on MinIO."
        exit 1
      fi

    # Prepare the local destination folder (mkdir -p is idempotent)
    - |
      echo "▶ Ensuring local destination folder exists: ${LOCAL_DEST_PATH}"
      if   [ -d "${LOCAL_DEST_PATH}" ]; then          # existing directory
          dir="${LOCAL_DEST_PATH}"
      else                                            # file or non‑existent path
          dir="$(dirname "${LOCAL_DEST_PATH}")"
      fi
      
      # Finally, create the directory
      mkdir -p "${dir}"
    # Pull from MinIO (recursive works also for a single object)
    - |
      echo "▶ Copying from MinIO …"            
      SRC="minio/${MINIO_BUCKET}/${MINIO_SOURCE_PATH}"
      DST="${LOCAL_DEST_PATH}"
      mkdir -p "$DST"  # ensure the destination exists
      mc cp --recursive "$SRC" "$DST"
  # Cache definition – **key & path are variable‑driven**
  cache:
    - key: "$CACHE_KEY"
      paths:
        - "$CACHE_PATH"
      policy: pull-push          # change to pull only / push only if you need

  # Minimal sanity‑check (you can add more if you wish)
  script:
    - |
      echo "'${MINIO_SOURCE_PATH}' has been copied to '${LOCAL_DEST_PATH}'."
      echo "Contents of '${LOCAL_DEST_PATH}':"
      ls -l "${LOCAL_DEST_PATH}"


# Concrete job(s) that *use* the template
update_or_create_new_cache_job:
  extends: .fetch_minio_cache_template
  # You can override the default variables in CI or give the below defaults via the new job variables section. Just make sure to set them correctly according to your needs:
  # "$CI_CACHE_KEY": If you use the existing key, then the cache will be updated with the new content, otherwise a new cache entry will be created (but note that the old cache will still exist and can be used by other jobs that reference the same key until it is pruned by GitLab).
  # "$CI_CACHE_DIR": This is the default cache path provided by GitLab, which is typically something like "${CI_PROJECT_DIR}/tests/test_data/". You can change it if you want, but using the default one is usually fine as long as it matches the path used in the cache definition above.
  # "$MINIO_SRC_PATH": This should point to the file or folder in the dedicated temp MinIO bucket (https://vbt-minio.fz-juelich.de/console/browser/ci-temp-cache) that you want to cache locally for the tests. Make sure it matches the actual structure in your bucket.
  # "$LOCAL_DEST_DIR": This should point to the local folder where you want the cached file/folder to be copied to. It should match the path used in the script above for the local destination. Make sure it is within the cache path: "$CI_CACHE_DIR" if you want it to be cached by GitLab.
  variables:
    CACHE_KEY: "$CI_CACHE_KEY"
    CACHE_PATH: "$CI_CACHE_DIR"
    MINIO_SOURCE_PATH: "$MINIO_SRC_PATH"
    LOCAL_DEST_PATH: "$LOCAL_DEST_DIR"

vbt_convert_job:
  # Convert raw VBT data to a master HDF5 file and then to the protocol‑specific
  # NumPy format.  The job activates the `vbt-data` project, validates the
  # supplied directories, runs both conversion scripts and stores the
  # resulting artefacts.

  # Job metadata
  extends: .VBT_RUN
  stage: conversion
  id_tokens:
    SITE_ID_TOKEN:
      aud: "https://gitlab.jsc.fz-juelich.de"
  when: manual  # allow manual triggering of the conversion job
  tags:
    - juwels
    - shell
  needs:
    - job: vbt_setup_job            # reuse the virtual‑env created earlier
      artifacts: true
  variables:
    # expose the common VBT variables (they are already defined globally)
    VBT_SUBMODULE_PATH: "${CI_PROJECT_DIR}/ci/template_repo"
    VBT_CONVERT_PROTOCOL: "uva"
    VBT_CONVERT_INPUT: "$DATA/VBT_T4-1_UvA_Protocol1/parametersweep_8s_3d_orientation_selective_12012026/"
    VBT_CONVERT_ANY_ARGS: '{"log-level":"INFO","no-raw-bundle":null}'
    VBT_CONVERT_HDF5_ARGS: '{"bin-size":0.001}'
  before_script:
    - !reference [ .VBT_RUN, before_script ]
    # Common helpers (fail‑fast, nice output)
    - set -euo pipefail
    - |
      log() {
        echo "[${CI_JOB_ID}] $*"
      }
    # Activate the **vbt‑data** project (the command blocks until the
    #     environment is ready; we abort if it never succeeds)
    - log "Activating the 'vbt-data' project …"
    - |
      # jutil returns 0 when the environment is ready.
      # We retry a few times because the data project may still be
      # mounting remote storage on the first attempt.
      max_attempts=10
      attempt=1
      while ! jutil env activate --project vbt-data; do
        if (( attempt >= max_attempts )); then
          log " Unable to activate vbt‑data after ${max_attempts} attempts – aborting."
          exit 1
        fi
        log "⚠️  Attempt ${attempt}/${max_attempts} failed – sleeping 10 s and retrying …"
        sleep 10
        ((attempt++))
      done
    # Helper that expands a JSON object into a Bash array of
    #     “--key value” pairs (skips keys whose value is null/empty)
    - |
      json_to_args() {
        # $1 → JSON string
        # Echo a space‑separated list that can be expanded with:
        #   eval set -- $(json_to_args "$JSON")
        echo "$1" | jq -r 'to_entries|map(if (.value|type)=="string" then "--\(.key) \(.value|@sh)" else "--\(.key) \(.value)" end) | join(" ")'
      }
  script:
    # Resolve / validate the $DATA variable that is exported by the
    #     vbt‑data environment.  All paths must be *children* of $DATA.
    - |
      # $DATA is set by the vbt‑data project – abort if it disappeared.
      if [[ -z "${DATA:-}" ]]; then
        log "\$DATA is not defined – the vbt‑data environment did not initialise correctly."
        exit 1
      fi
      log "\$DATA = ${DATA}"

      # Input directory
      INPUT="${DATA}/${VBT_CONVERT_INPUT}"
      if [[ ! -d "${INPUT}" ]]; then
        log " Input directory '${INPUT}' does not exist."
        exit 1
      fi
      log " Input directory resolved to '${INPUT}'"

      # Output HDF5 directory
      if [[ -n "${VBT_CONVERT_OUTPUT_HDF5:-}" ]]; then
        OUT_H5="${DATA}/${VBT_CONVERT_OUTPUT_HDF5}"
      else
        OUT_H5="${DATA}/${VBT_CONVERT_PROTOCOL}/converted/h5"
      fi
      mkdir -p "${OUT_H5}"
      log "HDF5 output will be written to '${OUT_H5}'"

      # Output NumPy directory
      if [[ -n "${VBT_CONVERT_OUTPUT_NUMPY:-}" ]]; then
        OUT_NPY="${DATA}/${VBT_CONVERT_OUTPUT_NUMPY}"
      else
        OUT_NPY="${DATA}/${VBT_CONVERT_PROTOCOL}/converted/numpy"
      fi
      mkdir -p "${OUT_NPY}"
      log "NumPy output will be written to '${OUT_NPY}'"

    # Build the *extra* argument strings for the two conversion tools.
    - |
      # Convert the JSON variables to a Bash‑compatible argument list.
      # If the variable is empty we simply pass an empty string.
      EXTRA_ANY_ARGS="$(json_to_args "${VBT_CONVERT_ANY_ARGS:-{}}")"
      EXTRA_H5_ARGS="$(json_to_args "${VBT_CONVERT_HDF5_ARGS:-{}}")"

      log "Extra arguments for convert_any_to_hdf5.py → ${EXTRA_ANY_ARGS}"
      log "Extra arguments for convert_hdf5_to_format.py → ${EXTRA_H5_ARGS}"
    # Convert any → master HDF5**
    - |
      MASTER_H5="${OUT_H5}/master.h5"
      log "Running convert_any_to_hdf5.py"
      log "   input      : ${INPUT}"
      log "   output h5  : ${MASTER_H5}"
      log "   protocol   : ${VBT_CONVERT_PROTOCOL}"
      # shellcheck disable=SC2086  # we *want* word‑splitting for the JSON‑derived args
      python converters/generic_converter/convert_any_to_hdf5.py \
        -i "${INPUT}" \
        -o "${MASTER_H5}" \
        --protocol "${VBT_CONVERT_PROTOCOL}" \
        ${EXTRA_ANY_ARGS}

      if [[ ! -f "${MASTER_H5}" ]]; then
        log "Expected master file '${MASTER_H5}' was not created."
        exit 1
      fi
      log "Master HDF5 created at '${MASTER_H5}'"
    # Convert master HDF5 → protocol‑specific NumPy**
    - |
      log "Running convert_hdf5_to_format.py"
      log "   input      : ${MASTER_H5}"
      log "   output dir : ${OUT_NPY}"
      # Again we deliberately allow word‑splitting for the JSON‑derived args.
      python converters/generic_converter/convert_hdf5_to_format.py \
        -i "${MASTER_H5}" \
        -o "${OUT_NPY}" \
        ${EXTRA_H5_ARGS} \
        "${VBT_CONVERT_PROTOCOL}"

      # The exporter writes a single *.npz* file inside the output dir.
      # Verify that at least one file is present.
      if [[ -z "$(find "${OUT_NPY}" -maxdepth 1 -type f -name '*.npz' -print -quit)" ]]; then
        log "No NumPy (*.npz) files were created in '${OUT_NPY}'."
        exit 1
      fi
      log "NumPy export completed – files are in '${OUT_NPY}'"
    # Write the paths to a tiny text file (later attached as artefact)
    - |
      PATHS_FILE="${CI_PROJECT_DIR}/conversion-paths.txt"
      {
        echo "MASTER_H5=${MASTER_H5}"
        echo "NUMPY_OUTPUT=${OUT_NPY}"
      } > "${PATHS_FILE}"
      log "Paths recorded in '${PATHS_FILE}'"
  artifacts:
    # -----------------------------------------------------------------
    # The artefacts we want to keep after the job finishes:
    #   • the generated master.h5   (so the next stage can reuse it if needed)
    #   • the whole NumPy output dir
    #   • the tiny text file that records the two absolute paths
    # -----------------------------------------------------------------
    when: always
    paths:
      - "${OUT_H5}/master.h5"
      - "${OUT_NPY}/"
      - "conversion-paths.txt"
    expire_in: 1 week