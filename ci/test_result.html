<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HDF5 Comparison Result</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .info {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }
        .status {
            font-weight: bold;
            padding: .5rem 1rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: .5rem;
        }
        .success { background:#dff0d8; color:#3c763d; }
        .failure { background:#f2dede; color:#a94442; }
        .path { font-family: monospace; }
    </style>
</head>
<body>

<h1>HDF5 Comparison Result</h1>

<div class="info">
    <p><strong>Ground‑truth file:</strong> <span class="path">{ground_truth}</span></p>
    <p><strong>Test‑generated file:</strong> <span class="path">{output_hdf}</span></p>

    <p class="status {status_class}">{status_message}</p>
</div>

</body>
</html>
