link CONV_OUT to EXPORT--><path d="M1251.73,228.89 C1294.16,236.85 1344.07,251.19 1383,277 C1400.06,288.31 1414.66,305.35 1425.9,321.43 " fill="none" id="CONV_OUT-&gt;EXPORT" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="1428.98,325.93,1427.2159,316.2404,1426.1638,321.7986,1420.6056,320.7464,1428.98,325.93" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="215" x="1404" y="291.897">writes protocol‑specific files (.npz, …)</text><!--MD5=[9466cb858ca7cbf1969672aab0488fdb]
@startuml dfd_level_0
actor User

folder "Raw Input (CSV / Directory)" as INPUT
database "Master HDF5 Bundle\n(.h5)" as MASTER
folder "Protocol PDF / Info" as PROTOINFO
folder "Raw ZIP Bundle (optional)" as RAWZIP
folder "Exported Protocol Files\n(.npz, .dsr.npz, …)" as EXPORT

rectangle "convert_any_to_hdf5\n(main)" as CONV_IN
rectangle "convert_hdf5_to_format\n(main)" as CONV_OUT

User - -> CONV_IN : invoke CLI\n(-i, -o, - -protocol …)
CONV_IN - -> INPUT : reads raw data
CONV_IN - -> PROTOINFO : reads protocol PDF (optional)
CONV_IN - -> RAWZIP : creates zipped raw bundle (optional)

CONV_IN - -> MASTER : writes MasterBundle (HDF5)

User - -> CONV_OUT : invoke CLI\n(-i, -o, protocol sub‑command …)
CONV_OUT - -> MASTER : reads MasterBundle
CONV_OUT - -> PROTOINFO : may need protocol PDF (validation)
CONV_OUT - -> EXPORT : writes protocol‑specific files (.npz, …)

@enduml

