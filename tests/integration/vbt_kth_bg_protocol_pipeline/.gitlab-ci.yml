# -------------------------------------------------
# .gitlab-ci.yml – VBT‑converter CI pipeline
# -------------------------------------------------
# Stages
stages:
  - setup_environment
  - test
  - publish_report
  - cleanup

# -----------------------------------------------------------------
# Global variables – keep the same behavior as the original template
# -----------------------------------------------------------------
variables:
  # Force the runner to check out sub‑modules (normal)
  GIT_SUBMODULE_STRATEGY: "normal"

# -----------------------------------------------------------------
# Pull the generic VBT CI definition from the central template repo
# -----------------------------------------------------------------
include:
  - project: 'virtualbraintwin/VBT_protocol_template'   # full path of the source project
    ref:    main                                         # branch / tag you want to use
    file:   '/ci/template.yml'                          # path inside the source repo

vbt_setup_job:
  extends: .VBT_SETUP                     # provided by the template
  stage: setup_environment
  image: docker:cli
  tags:
    - docker
    - jsc-cloud
    - fenix
  before_script:
    - export VBT_SUBMODULE_PATH="${CI_PROJECT_DIR}/ci/template_repo"
    - export VBT_SETUP_SCRIPT="${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/setup_environment.sh"
    - export VBT_REQUIREMENTS="${CI_PROJECT_DIR}/requirements.txt"
    - echo "Installing jq and Python in the Alpine runner …"
    - apk add --no-cache jq python3 bash curl
    - !reference [ .VBT_SETUP, before_script ]  # Calls the base "method"

test_vbt_convert_parameter_sweep_dir_to_hdf5:
  extends: .VBT_RUN                       # provided by the template
  stage: test
  tags:
    - docker
    - jsc-cloud
    - fenix
  image: docker:cli
  needs:
    - job: vbt_setup_job
      artifacts: true
  variables:
    # The entry‑script for the tests stage is simply “pytest”
    HDF5_DISABLE_VERSION_CHECK: "1"  # Avoid HDF5 version check warnings in the logs
  before_script:
    - export PYTHONPATH="${PYTHONPATH}:${CI_PROJECT_DIR}"
    - export VBT_ENABLE_OUTPUT_DIR_RECURSIVE_ATTACH="false" # Do not attach the whole output dir as artifact
    - export VBT_ENABLE_INPUT_DIR_RECURSIVE_ATTACH="false" # Do not attach the whole input dir as artifact
    - export VBT_ALLURE_PARENT_SUITE="VBT‑converter CI/CD"
    - export VBT_ALLURE_SUITE="Integration Tests BG Protocol Pipeline"
    - export VBT_ALLURE_SUB_SUITE="Conversion of parameter‑sweep‑style directories to HDF5 file and validation of the converted file against the ground‑truth HDF5 file"
    - export VBT_ALLURE_EPIC="Guarantee that the converter works for every possible input layout"
    - export VBT_ALLURE_FEATURE="Use of cached test data to validate the converter’s functionality for a directory layout that is representative of real‑world use cases"
    - export VBT_ALLURE_STORY="Integration test for the conversion of parameter‑sweep‑style directories to HDF5 file and validation of the converted file against the ground‑truth HDF5 file (https://tvb-projects.atlassian.net/browse/VT-233)"
    - export VBT_ALLURE_LINK_JIRA="https://tvb-projects.atlassian.net/browse/VT-233"
    - export VBT_DYNAMIC_TEST_NAME_SUFFIX="test_vbt_bg_convert_parameter_sweep_dir_to_hdf5"
    - export VBT_ALLURE_TEST_TITLE="test_vbt_bg_convert_parameter_sweep_dir_to_hdf5"
    - export VBT_ALLURE_LINK_PIPELINE="${CI_PIPELINE_URL}"
    - export VBT_ALLURE_LINK_JOB="${CI_JOB_URL}"
    - export VBT_SUBMODULE_PATH="${CI_PROJECT_DIR}/ci/template_repo"
    - export VBT_ENTRY_SCRIPT="${CI_PROJECT_DIR}/tests/integration/vbt_kth_bg_protocol_pipeline/vbt_converter_ps_to_hdf5_wrapper.py"
    - export VBT_INPUT_PATH="${CI_PROJECT_DIR}/tests/test_data/VBT_KTH_BG_Protocol/"
    - export VBT_OUTPUT_PATH="${CI_PROJECT_DIR}/data/"
    - export OUTPUT_BUNDLE_PATH="${CI_PROJECT_DIR}/attachments/bundle"
    - export VBT_ALLURE_DESCRIPTION_HTML="${CI_PROJECT_DIR}/tests/integration/docs/vbt_bg_protocol/vbt_converter_ps_to_hdf5_wrapper.html"
    - echo "Installing dependencies in the docker runner …"
    - apk add --no-cache jq python3 bash perl gettext curl hdf5-tools
    - !reference [ .VBT_RUN, before_script ]  # Calls the base "method"
  # The artifacts are needed by the publishing stage (Allure results)
  cache:
    - key: vbt-kth-bg-protocol-cache
      paths:
        - tests/test_data/
      policy: pull
    - key: vbt-kth-bg-protocol-cache-bundle
      paths:
        - attachments/bundle/
      policy: push
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 1 week

vbt_publish_job:
  extends: .VBT_PUBLISH
  stage: publish_report
  tags:
    - docker
    - jsc-cloud
    - fenix
  needs:
    - job: test_vbt_convert_parameter_sweep_dir_to_hdf5
      artifacts: true
  before_script:
    - export VBT_ALLURE_LINK_PIPELINE="${CI_PIPELINE_URL}"
    - export VBT_ALLURE_LINK_JOB="${CI_JOB_URL}"
    - export VBT_SUBMODULE_PATH="${CI_PROJECT_DIR}/ci/template_repo"
    - export VBT_PUBLISH_SCRIPT="${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/publish_report.sh"
    - echo "Installing dependencies in the Alpine runner …"
    - apk add --no-cache jq unzip
    - !reference [ .VBT_PUBLISH, before_script ]  # Calls the base "method"

vbt_cleanup_job:
  extends: .VBT_CLEANUP
  stage: cleanup
  tags:
    - docker
    - jsc-cloud
    - fenix
  needs:
    - job: vbt_publish_job
      artifacts: false
  variables:
    VBT_CLEANUP_SCRIPT: "${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/cleanup_environment.sh"
  before_script:
    - export VBT_SUBMODULE_PATH="${CI_PROJECT_DIR}/ci/template_repo"
    - export VBT_CLEANUP_SCRIPT="${CI_PROJECT_DIR}/ci/template_repo/ci/scripts/cleanup_environment.sh"
    - !reference [ .VBT_RUN, before_script ]  # Calls the base "method"